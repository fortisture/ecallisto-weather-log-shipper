<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARRAY-7 · Site Conditions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">

  <script src="./vendor/chart.js"></script>
</head>

<body>

  <div class="wrap">

    <!-- ==================== HEADER ==================== -->

    <header>

      <div class="id-block">
        <div class="eyebrow">Site Conditions</div>

        <h1>
          ARRAY-7
          <span>/ Weather Station</span>
        </h1>
      </div>

      <div class="status-block">

        <div class="status-line">
          <span class="dot"></span>
          <span id="connection-status">DATA: API FEED</span>
        </div>

        <div id="last-updated">
          SYNCED —
        </div>

      </div>

    </header>


    <!-- ==================== CURRENT CONDITIONS ==================== -->

    <section class="panel">

      <div class="panel-head">

        <span class="label">
          Current Conditions
        </span>

        <span class="tag">
          WEATHER API
        </span>

      </div>


      <div class="conditions">

        <!-- Main temperature -->

        <div>

          <div class="reading-main">

            <span
              class="reading-value"
              id="current-temp"
            >
              —
            </span>

            <span class="reading-unit">
              °C
            </span>

          </div>

          <div
            class="reading-sub"
            id="current-timestamp"
          >
            AWAITING READING
          </div>

        </div>


        <!-- 24 hour statistics -->

        <div class="telemetry-strip">

          <div class="telemetry-cell">

            <div class="t-label">
              24H Min
            </div>

            <div
              class="t-value"
              id="stat-min"
            >
              —
            </div>

          </div>


          <div class="telemetry-cell ok">

            <div class="t-label">
              24H Avg
            </div>

            <div
              class="t-value"
              id="stat-avg"
            >
              —
            </div>

          </div>


          <div class="telemetry-cell warn">

            <div class="t-label">
              24H Max
            </div>

            <div
              class="t-value"
              id="stat-max"
            >
              —
            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- ==================== TEMPERATURE CHART ==================== -->

    <section class="panel chart-panel">

      <div class="panel-head">

        <span class="label">
          Temperature · 24H Trend
        </span>

        <span
          class="tag"
          id="sample-label"
        >
          LOADING
        </span>

      </div>


      <div class="chart-body">

        <canvas id="temp-chart"></canvas>

      </div>


      <div class="chart-footer">

        <span id="chart-range">
          AWAITING DATA
        </span>

        <span id="sample-count">
          — SAMPLES
        </span>

      </div>

    </section>


    <!-- ==================== FOOTER ==================== -->

    <footer class="page-footer">
      ARRAY-7 GROUND SUPPORT · WEATHER API · UTC
    </footer>

  </div>


  <!-- ==================== JAVASCRIPT ==================== -->

  <script>

    /*
     * ARRAY-7 Weather Station
     *
     * API contract:
     *
     * GET /api/weather/latest
     * GET /api/weather/history?range=24h
     * GET /api/status              (optional)
     *
     * Weather fields:
     * timestamp
     * temp_c
     * humidity
     * pressure_hpa
     * wind_kmh
     * rain_mm
     *
     * All timestamps are UTC ISO 8601 with trailing Z.
     */


    let tempChart = null;


    // ============================================================
    // API
    // ============================================================

    async function fetchJSON(url) {

      const response = await fetch(url, {
        headers: {
          'Accept': 'application/json'
        }
      });

      if (!response.ok) {
        throw new Error(
          `${url} returned HTTP ${response.status}`
        );
      }

      return response.json();
    }


    async function loadLatestWeather() {
  return fetchJSON('api/weather/latest.json');
}


    async function loadWeatherHistory() {

      return fetchJSON(
        'api/weather/history?range=24h'
      );
    }


    async function loadSystemStatus() {

      try {

        return await fetchJSON('/api/status');

      } catch (error) {

        // /api/status is optional in the contract.
        // Do not make the weather dashboard fail if it
        // has not been implemented yet.

        return null;
      }
    }


    // ============================================================
    // TIME FORMATTING
    // ============================================================

    function parseDate(iso) {

      const date = new Date(iso);

      if (Number.isNaN(date.getTime())) {
        throw new Error(`Invalid timestamp: ${iso}`);
      }

      return date;
    }


    function fmtTime(iso) {

      const date = parseDate(iso);

      return (
        date.toISOString().slice(11, 16) +
        ' UTC'
      );
    }


    function fmtFullTime(iso) {

      const date = parseDate(iso);

      return (
        date.toISOString()
          .replace('T', ' ')
          .slice(0, 16) +
        ' UTC'
      );
    }


    function fmtDate(iso) {

      const date = parseDate(iso);

      return date.toISOString().slice(0, 10);
    }


    // ============================================================
    // NULL-SAFE NUMBER HELPERS
    // ============================================================

    /*
     * The API contract explicitly allows null values.
     *
     * Therefore we never call:
     *
     * value.toFixed(...)
     *
     * without checking whether value is null.
     */


    function formatTemperature(value, decimals = 1) {

      if (value === null || value === undefined) {
        return '—';
      }

      if (!Number.isFinite(Number(value))) {
        return '—';
      }

      return Number(value).toFixed(decimals);
    }


    function validTemperatures(readings) {

      return readings
        .map(reading => reading.temp_c)
        .filter(value =>
          value !== null &&
          value !== undefined &&
          Number.isFinite(Number(value))
        )
        .map(Number);
    }


    // ============================================================
    // STATISTICS
    // ============================================================

    function calculateTemperatureStats(readings) {

      const temperatures =
        validTemperatures(readings);


      if (temperatures.length === 0) {

        return {
          min: null,
          avg: null,
          max: null
        };
      }


      const min =
        Math.min(...temperatures);

      const max =
        Math.max(...temperatures);

      const avg =
        temperatures.reduce(
          (sum, value) => sum + value,
          0
        ) / temperatures.length;


      return {
        min,
        avg,
        max
      };
    }


    // ============================================================
    // CURRENT CONDITIONS
    // ============================================================

    function renderConditions(history) {

      const currentTemperature =
        latest.temp_c;


      // Main temperature

      document.getElementById(
        'current-temp'
      ).textContent =
        formatTemperature(currentTemperature);


      // Timestamp

      document.getElementById(
        'current-timestamp'
      ).textContent =
        latest.timestamp
          ? 'READING AT ' +
            fmtFullTime(latest.timestamp)
          : 'READING TIMESTAMP UNAVAILABLE';


      // 24 hour statistics

      const stats =
        calculateTemperatureStats(
          history.readings
        );


      document.getElementById(
        'stat-min'
      ).textContent =
        formatTemperature(stats.min) + '°';


      document.getElementById(
        'stat-avg'
      ).textContent =
        formatTemperature(stats.avg) + '°';


      document.getElementById(
        'stat-max'
      ).textContent =
        formatTemperature(stats.max) + '°';


      // Last data timestamp

      document.getElementById(
        'last-updated'
      ).textContent =
        latest.timestamp
          ? 'SYNCED ' +
            fmtFullTime(latest.timestamp)
          : 'SYNCED —';
    }


    // ============================================================
    // SYSTEM STATUS
    // ============================================================

    function renderSystemStatus(status) {

      const statusText =
        document.getElementById(
          'connection-status'
        );


      if (!status) {

        statusText.textContent =
          'DATA: API FEED';

        return;
      }


      if (status.weather_online === true) {

        statusText.textContent =
          'DATA: WEATHER ONLINE';

      } else {

        statusText.textContent =
          'DATA: WEATHER OFFLINE';
      }


      if (status.weather_last_seen) {

        document.getElementById(
          'last-updated'
        ).textContent =
          'LAST DATA ' +
          fmtFullTime(
            status.weather_last_seen
          );
      }
    }


    // ============================================================
    // CHART
    // ============================================================

    function renderChart(history) {

      const readings =
        Array.isArray(history.readings)
          ? history.readings
          : [];


      /*
       * Keep timestamps and temperatures aligned.
       *
       * We do not remove readings with null temperature
       * values because timestamps are still part of the
       * historical sequence.
       *
       * Chart.js will treat null as a gap.
       */

      const labels =
        readings.map(reading =>
          reading.timestamp
            ? fmtTime(reading.timestamp)
            : ''
        );


      const values =
        readings.map(reading => {

          if (
            reading.temp_c === null ||
            reading.temp_c === undefined
          ) {
            return null;
          }

          const value =
            Number(reading.temp_c);

          return Number.isFinite(value)
            ? value
            : null;
        });


      const canvas =
        document.getElementById(
          'temp-chart'
        );


      const ctx =
        canvas.getContext('2d');


      // Prevent duplicate charts if data is refreshed.

      if (tempChart) {

        tempChart.destroy();
      }


      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          300
        );


      gradient.addColorStop(
        0,
        'rgba(79, 216, 196, 0.28)'
      );


      gradient.addColorStop(
        1,
        'rgba(79, 216, 196, 0.0)'
      );


      tempChart =
        new Chart(ctx, {

          type: 'line',


          data: {

            labels: labels,


            datasets: [{

              label: 'Temperature (°C)',

              data: values,

              borderColor: '#4FD8C4',

              backgroundColor: gradient,

              borderWidth: 1.5,

              pointRadius: 0,

              pointHoverRadius: 4,

              pointHoverBackgroundColor:
                '#4FD8C4',

              pointHoverBorderColor:
                '#0A0E13',

              fill: true,

              tension: 0.25,

              spanGaps: false

            }]

          },


          options: {

            responsive: true,

            maintainAspectRatio: false,


            interaction: {

              mode: 'index',

              intersect: false

            },


            plugins: {

              legend: {

                display: false

              },


              tooltip: {

                backgroundColor:
                  '#151D27',

                borderColor:
                  '#263140',

                borderWidth: 1,

                titleColor:
                  '#6B7A8B',

                bodyColor:
                  '#DCE4EC',


                titleFont: {

                  family:
                    'IBM Plex Mono',

                  size: 10

                },


                bodyFont: {

                  family:
                    'IBM Plex Mono',

                  size: 12

                },


                padding: 10,

                displayColors: false,


                callbacks: {

                  label: function(item) {

                    if (
                      item.parsed.y === null
                    ) {

                      return 'Temperature —';

                    }

                    return (
                      item.parsed.y
                        .toFixed(2) +
                      ' °C'
                    );
                  }

                }

              }

            },


            scales: {

              x: {

                grid: {

                  color:
                    '#1A2229',

                  drawTicks: false

                },


                ticks: {

                  color:
                    '#45525F',


                  font: {

                    family:
                      'IBM Plex Mono',

                    size: 10

                  },


                  maxTicksLimit: 8,

                  maxRotation: 0

                },


                border: {

                  color:
                    '#263140'

                }

              },


              y: {

                grid: {

                  color:
                    '#1A2229',

                  drawTicks: false

                },


                ticks: {

                  color:
                    '#45525F',


                  font: {

                    family:
                      'IBM Plex Mono',

                    size: 10

                  },


                  callback:
                    value =>
                      Number(value)
                        .toFixed(0) +
                      '°'

                },


                border: {

                  display: false

                }

              }

            }

          }

        });


      // ==========================================================
      // Chart footer
      // ==========================================================

      if (readings.length === 0) {

        document.getElementById(
          'chart-range'
        ).textContent =
          'NO HISTORY DATA';

        document.getElementById(
          'sample-count'
        ).textContent =
          '0 SAMPLES';

        document.getElementById(
          'sample-label'
        ).textContent =
          'NO DATA';

        return;
      }


      const first =
        readings[0].timestamp;

      const last =
        readings[readings.length - 1].timestamp;


      document.getElementById(
        'chart-range'
      ).textContent =
        fmtDate(first) +
        ' ' +
        fmtTime(first) +
        ' → ' +
        fmtTime(last);


      document.getElementById(
        'sample-count'
      ).textContent =
        readings.length +
        ' SAMPLES';


      /*
       * The original interface said "5 MIN SAMPLE".
       *
       * The API contract does NOT guarantee a 5-minute
       * interval. Therefore we don't invent that fact.
       *
       * We determine the interval from the first two
       * readings when possible.
       */

      const intervalMinutes =
        getSamplingIntervalMinutes(
          readings
        );


      if (intervalMinutes !== null) {

        document.getElementById(
          'sample-label'
        ).textContent =
          intervalMinutes +
          ' MIN SAMPLE';

      } else {

        document.getElementById(
          'sample-label'
        ).textContent =
          'VARIABLE SAMPLE';
      }
    }


    // ============================================================
    // SAMPLE INTERVAL
    // ============================================================

    function getSamplingIntervalMinutes(readings) {

      if (readings.length < 2) {

        return null;
      }


      const first =
        parseDate(
          readings[0].timestamp
        );


      const second =
        parseDate(
          readings[1].timestamp
        );


      const differenceMs =
        Math.abs(
          second.getTime() -
          first.getTime()
        );


      const minutes =
        differenceMs /
        (1000 * 60);


      if (!Number.isFinite(minutes)) {

        return null;
      }


      return Math.round(minutes);
    }


    // ============================================================
    // LOAD DASHBOARD
    // ============================================================

    async function loadDashboard() {

      try {

        /*
         * Latest and history are separate API endpoints
         * according to the contract.
         *
         * Load them together.
         */

        const [
          latest,
          history,
          status
        ] = await Promise.all([

          loadLatestWeather(),

          loadWeatherHistory(),

          loadSystemStatus()

        ]);


        // Basic contract validation

        if (
          !latest ||
          typeof latest !== 'object'
        ) {

          throw new Error(
            'Invalid /api/weather/latest response'
          );
        }


        if (
          !history ||
          !Array.isArray(history.readings)
        ) {

          throw new Error(
            'Invalid /api/weather/history response'
          );
        }


        renderConditions(
          latest,
          history
        );


        renderChart(history);


        renderSystemStatus(
          status
        );


      } catch (error) {

        console.error(
          'ARRAY-7 weather dashboard error:',
          error
        );


        document.getElementById(
          'connection-status'
        ).textContent =
          'DATA: API ERROR';


        document.getElementById(
          'last-updated'
        ).textContent =
          'SYNC FAILED';


        document.getElementById(
          'current-timestamp'
        ).textContent =
          'WEATHER DATA LOAD FAILED';


        document.getElementById(
          'current-temp'
        ).textContent =
          '—';


        document.getElementById(
          'stat-min'
        ).textContent =
          '—';


        document.getElementById(
          'stat-avg'
        ).textContent =
          '—';


        document.getElementById(
          'stat-max'
        ).textContent =
          '—';


        document.getElementById(
          'chart-range'
        ).textContent =
          'API DATA UNAVAILABLE';


        document.getElementById(
          'sample-count'
        ).textContent =
          '— SAMPLES';


        document.getElementById(
          'sample-label'
        ).textContent =
          'API ERROR';
      }
    }


    // ============================================================
    // START
    // ============================================================

    loadDashboard();

  </script>

</body>
</html>
